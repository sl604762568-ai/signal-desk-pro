 let piv=chanPivots(data);for(let z=0;z+3<piv.length;z+=3){let q=piv.slice(z,z+4),lows=q.map(x=>x.v).sort((a,b)=>a-b),zoneL=lows[1],zoneH=lows[2];if(zoneH>zoneL){ctx.fillStyle='#845dca35';ctx.strokeStyle='#aa7fff88';let x=fx(q[0].i),ww=fx(q[3].i)-x;ctx.fillRect(x,fy(zoneH),ww,fy(zoneL)-fy(zoneH));ctx.strokeRect(x,fy(zoneH),ww,fy(zoneL)-fy(zoneH));ctx.fillStyle='#c49cff';ctx.font='11px sans-serif';ctx.fillText('中枢',x+4,fy(zoneH)+13)}}
 ctx.strokeStyle='#f0c84b';ctx.lineWidth=2.2;ctx.beginPath();piv.forEach((p,i)=>i?ctx.lineTo(fx(p.i),fy(p.v)):ctx.moveTo(fx(p.i),fy(p.v)));ctx.stroke();
 let lows=piv.filter(p=>p.type==='L').slice(-3),highs=piv.filter(p=>p.type==='H').slice(-3);lows.forEach((p,i)=>{ctx.fillStyle='#32e58a';ctx.beginPath();ctx.arc(fx(p.i),fy(p.v)+10,7,0,Math.PI*2);ctx.fill();ctx.fillStyle='#aaffd2';ctx.font='11px sans-serif';ctx.fillText(`${i+1}买`,fx(p.i)-10,fy(p.v)+26)});highs.forEach((p,i)=>{ctx.fillStyle='#ff5964';ctx.beginPath();ctx.arc(fx(p.i),fy(p.v)-10,7,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ff9aa0';ctx.font='11px sans-serif';ctx.fillText(`${i+1}卖`,fx(p.i)-10,fy(p.v)-18)});
 let last=data.at(-1).close,recent=data.slice(-20),support=Math.max(...recent.map(x=>x.low).filter(x=>x<last)),resist=Math.min(...recent.map(x=>x.high).filter(x=>x>last));if(!isFinite(support))support=Math.min(...recent.map(x=>x.low));if(!isFinite(resist))resist=Math.max(...recent.map(x=>x.high));[['支撑',support,'#32e58a'],['压力',resist,'#ff5964']].forEach(x=>{ctx.strokeStyle=x[2];ctx.setLineDash([6,5]);ctx.beginPath();ctx.moveTo(0,fy(x[1]));ctx.lineTo(w-54,fy(x[1]));ctx.stroke();ctx.setLineDash([]);ctx.fillStyle=x[2];ctx.font='12px sans-serif';ctx.fillText(`${x[0]} ${x[1].toFixed(2)}`,w-110,fy(x[1])-4)});
