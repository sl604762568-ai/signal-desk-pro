services:
  - type: web
    name: signal-desk-pro
    runtime: docker
    plan: 0.5c-512mb
    region: singapore
    autoDeploy: true
    healthCheckPath: /api/health
    numInstances: 1
    disk:
      name: signal-desk-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: CACHE_SECONDS
        value: "75"
      - key: LIVE_REFRESH_TIMEOUT
        value: "45"
      - key: LIVE_RETRY_COOLDOWN
        value: "30"
      - key: PUBLIC_SOURCE_TIMEOUT
        value: "4.5"
      - key: SINA_WORKERS
        value: "10"
      - key: NEWSNOW_BASE_URL
        value: https://newsnow.busiyi.world
      - key: NEWS_TIMEOUT
        value: "5"
      - key: HOTSPOT_DESK_URL
        value: https://hotspot-link-desk.sl604762568.chatgpt.site
      - key: DB_PATH
        value: /var/data/signal_desk.db
      - key: PAPER_REFRESH_SECONDS
        value: "60"
      - key: PAPER_MARKET_TIMEOUT
        value: "20"
      - key: PAPER_CACHE_MAX_AGE
        value: "150"
